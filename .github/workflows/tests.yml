name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
      - run: python -m pip install -r requirements-dev.txt
      - name: Byte-compile sources and tools
        run: python -m compileall -q leanwatts_can tools
      - name: Run tests (fake instruments only; no hardware or network)
        # Qt can crash in process teardown after all tests pass (exit 139 Linux, 1 Windows);
        # the verdict is the result file written by the runner, checked in the next step.
        continue-on-error: true
        run: python tools/run_unit_tests.py
      - name: Verify test result
        run: python -c "import pathlib,sys; r=pathlib.Path('test-result.txt'); sys.exit(0 if r.exists() and r.read_text().strip()=='PASS' else 1)"
